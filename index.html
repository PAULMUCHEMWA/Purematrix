:root{color-scheme:dark;--ink:#06102B;--ink2:#0B1A3F;--line:rgba(143,172,238,.17);--blue:#2F6BFF;--sky:#7DBEFF;--gold:#FFC83D;--mist:#EEF3FF;--mute:#9DB0D8;--ok:#3DDC97;--bad:#FF7070;--r:18px;--disp:Sora,"Segoe UI",system-ui,sans-serif;--body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--mist);font:500 16px/1.5 var(--body);background:var(--ink)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 520px at 88% -8%,rgba(47,107,255,.30),transparent 62%),radial-gradient(700px 480px at -8% 38%,rgba(255,200,61,.07),transparent 60%),linear-gradient(var(--ink),#050C22)}
button{font-family:inherit}
#shell{display:flex;min-height:100vh}
.col{flex:1;min-width:0;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.col>*{max-width:1100px;margin-left:auto;margin-right:auto}
.side{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px}
.top h1{margin:0;font:700 22px var(--disp);letter-spacing:-.01em}
.tl2{display:flex;align-items:center;gap:10px;min-width:0}
.mlogo,.logo{display:block;border-radius:50%;background:#fff;padding:2px;flex:none}.mlogo{width:38px;height:38px}
.mode{font-size:13px;font-weight:600;color:var(--gold);border:1px solid rgba(255,200,61,.4);border-radius:99px;padding:3px 11px}.mode:empty{display:none}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}
.bell{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--mist);font-size:20px;cursor:pointer}
.bell i{position:absolute;top:-6px;right:-6px;font-style:normal;background:#FF4D5E;color:#fff;border-radius:99px;font:700 11.5px var(--body);min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 5px}.bell i:empty{display:none}
.avbtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.av{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font:700 15px var(--disp);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 50%),hsl(calc(var(--h) + 40) 70% 36%))}
.nb{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:99px;background:#FF4D5E;color:#fff;font:700 12px var(--body);text-align:center}.nb:empty{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(8,18,48,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:0;background:none;color:var(--mute);font:600 12px var(--body);cursor:pointer;border-radius:12px}
.bitem .ico{font-size:21px;line-height:1.15}.bitem.on{color:var(--gold)}.bitem .nb{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;line-height:18px;font-size:11px}
body.out .side,body.out .top,body.out .bnav,body.out .ft{display:none!important}body.out .col{padding:0}body.out .col>*{max-width:none}
@media(min-width:960px){
 .side{display:flex;flex-direction:column;gap:6px;width:252px;flex:none;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:rgba(6,14,38,.55);backdrop-filter:blur(12px)}
 .col{padding:0 36px 48px}.bnav,.mlogo,.avbtn{display:none!important}.top h1{font-size:30px}.top{padding-top:26px}}
.sbrand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}.sbrand .logo{width:44px;height:44px}.sbrand b{display:block;font:700 18px var(--disp)}.sbrand small{color:var(--mute);font-size:13px}
.snav{display:flex;flex-direction:column;gap:4px;flex:1}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:13px;background:none;color:var(--mist);font:600 16px var(--body);cursor:pointer;text-align:left;transition:background .15s}
.sitem .ico{width:26px;text-align:center;font-size:20px}.sitem span:nth-child(2){flex:1}.sitem:hover{background:rgba(255,255,255,.06)}.sitem.on{background:rgba(255,200,61,.13);color:var(--gold)}
.suser{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.ucard{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;color:var(--mist);text-align:left;cursor:pointer;padding:6px;border-radius:13px;font:700 15px var(--body)}.ucard:hover{background:rgba(255,255,255,.06)}.ucard small{display:block;color:var(--mute);font-weight:500;font-size:13px}.ucard b{display:block}
/* surfaces */
.gl{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));margin-bottom:16px}
.sec{margin:0 0 26px}.sec>h3,.sh h3,.cap,.h3{margin:0 0 12px;font:700 18px var(--disp);letter-spacing:-.01em}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sh h3{margin:0}
.cnt{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mute);font:600 13px var(--body);vertical-align:2px}
.link{background:none;border:0;color:var(--sky);font:600 15px var(--body);cursor:pointer;padding:6px 0}.link:hover{text-decoration:underline}
.hero{position:relative;overflow:hidden;border:1px solid rgba(125,190,255,.25);border-radius:24px;padding:28px 22px;margin-bottom:18px;min-height:200px;display:flex;align-items:center;background:linear-gradient(120deg,#15348A 0%,#0C1F55 55%,#0A1840 100%)}
.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 12% 0%,rgba(255,200,61,.17),transparent 70%);pointer-events:none}
.hmap{position:absolute;right:2%;top:10px;bottom:10px;width:50%;opacity:.4;display:flex;align-items:center;justify-content:flex-end}.hmap svg{height:100%;width:auto}
@media(min-width:700px){.hmap{opacity:.95;width:40%}.hero{padding:34px 36px;min-height:230px}}
.htxt{position:relative;z-index:1;max-width:540px}.date{margin:0 0 6px;color:#BFD0F5;font-size:15px}.hero h2{margin:0 0 10px;font:800 clamp(26px,5.4vw,40px)/1.08 var(--disp);letter-spacing:-.025em}.sum{margin:0;color:#D6E2FF;font-size:17px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px}.qa .qt:last-child:nth-child(odd){grid-column:1/-1}@media(min-width:720px){.qa .qt:last-child:nth-child(odd){grid-column:auto}}@media(min-width:720px){.qa{grid-template-columns:repeat(4,1fr)}}
.qt{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mist);text-align:left;font:700 16px/1.25 var(--body);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.qt:hover{border-color:rgba(255,200,61,.55);background:rgba(255,200,61,.07);transform:translateY(-2px)}
.qt i{font-style:normal;display:grid;place-items:center;width:48px;height:48px;border-radius:15px;font-size:25px;background:var(--tint)}.qt small{display:block;color:var(--mute);font-weight:500;font-size:13.5px;margin-top:2px}
.allclear{padding:20px;border:1px dashed var(--line);border-radius:16px;color:var(--mute);text-align:center}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:14px;margin-bottom:16px;background:rgba(255,200,61,.10);border:1px solid rgba(255,200,61,.4)}
.split{display:grid;gap:16px}@media(min-width:1000px){.split{grid-template-columns:1.1fr 1fr;align-items:start}}
/* action rows */
.attrow{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 10px;padding:14px;border-radius:16px;border:1px solid rgba(255,200,61,.38);background:linear-gradient(90deg,rgba(255,200,61,.11),rgba(255,200,61,.04));color:var(--mist);font:600 16px/1.35 var(--body);text-align:left}
.attrow.urg{border-color:rgba(255,112,112,.6);background:linear-gradient(90deg,rgba(255,112,112,.15),rgba(255,112,112,.04))}
.attrow.fd{border-color:var(--line);background:rgba(255,255,255,.04);cursor:pointer}
.attrow>b{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);font-size:22px;font-weight:400}
.attrow>span{flex:1;min-width:0;overflow-wrap:anywhere}.attrow>span[data-a]{cursor:pointer}.attrow .btn,.attrow .pill{flex:none}.attrow small{color:var(--mute)}
@media(max-width:560px){.attrow{flex-wrap:wrap}.attrow>span{flex-basis:calc(100% - 58px)}.attrow .btn{width:100%}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border:0;border-radius:13px;cursor:pointer;font:700 15px var(--body);color:#1A1300;background:linear-gradient(180deg,#FFD65C,#FFC02E);box-shadow:0 6px 18px rgba(255,192,46,.22);transition:transform .12s,filter .12s;text-decoration:none}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn.g{background:rgba(255,255,255,.05);color:var(--mist);border:1px solid var(--line);box-shadow:none}
.btn.r{background:rgba(255,112,112,.08);color:var(--bad);border:1px solid rgba(255,112,112,.4);box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#58E8A9,#33CC8B);color:#04200F;box-shadow:0 6px 18px rgba(61,220,151,.2)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}.btn.big{width:100%;min-height:54px;font-size:17px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}.fm>*{min-width:0}
.fm label,.lcard label{display:grid;gap:6px;font:600 14px var(--body);color:var(--mute)}
.fm .w,.fm button[type=submit]{grid-column:1/-1}
@media(max-width:560px){.fm{grid-template-columns:1fr}}
.fm[data-kind=item] .cashonly,.fm[data-kind=cash] .itemonly{display:none}
input,select,textarea{font:500 16px var(--body);width:100%;min-width:0;min-height:48px;padding:11px 14px;border-radius:12px;color:var(--mist);background:rgba(4,10,30,.55);border:1px solid var(--line)}
textarea{min-height:96px;resize:vertical}input[type=range]{padding:0;min-height:30px;accent-color:var(--gold)}
input[type=checkbox]{width:20px;min-height:20px;height:20px;padding:0;accent-color:var(--gold);flex:none}
input[readonly]{opacity:.7}option{background:#0B1A40}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.28)}
.fm label.row,.fm .perms label,.asg label{display:flex;gap:10px;align-items:center;font:500 15px var(--body);color:var(--mist)}
.perms{display:grid;gap:10px;margin:8px 0 14px}.grp>b{display:block;margin-top:10px;font:700 15px var(--disp)}
.asg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mist);font:600 14.5px var(--body);cursor:pointer}.chip.on{background:rgba(255,200,61,.14);border-color:var(--gold);color:var(--gold)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;flex:none;padding:3px 11px;border-radius:99px;font:700 12.5px var(--body);color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.err{color:var(--bad);font-size:14.5px;min-height:20px}
.hist{font-size:14px;color:var(--mute)}.m{color:var(--mute);font-size:14px}
/* lists & cards */
ul{list-style:none;margin:0;padding:0}.scroll{max-height:64vh;overflow:auto}
li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}li:first-child{border-top:0}li[data-a]{cursor:pointer}li[data-a]:hover{background:rgba(255,255,255,.03)}
li .ic{flex:none;width:42px;display:grid;place-items:center;font-size:22px}li .t{flex:1;min-width:0}li b{display:block;font:700 16px var(--body);overflow-wrap:anywhere}li .t span{display:block;color:var(--mute);font-size:14px}
li select{width:auto;min-height:40px;font-size:14px;padding:6px 10px;flex:none}li.un b:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:8px}
.ago{color:var(--mute);font-size:13px;flex:none}.empty{color:var(--mute);justify-content:center;padding:22px 0;text-align:center}
.mini{flex:none;width:52px;height:52px}.dn text{font-family:var(--disp);font-weight:800;fill:#fff}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:rgba(255,255,255,.04);margin-bottom:12px}.card.urg{border-color:rgba(255,112,112,.55)}.card.done{border-color:rgba(61,220,151,.4)}
.rh{display:flex;align-items:flex-start;gap:12px}.rico{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:rgba(47,107,255,.22);font-size:22px}.rt{flex:1;min-width:0}.rt h4{margin:0 0 2px;font:700 17px/1.25 var(--body);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
details.mo>summary{cursor:pointer;color:var(--sky);font:600 14.5px var(--body);padding:8px 0;list-style:none}details.mo>summary::-webkit-details-marker{display:none}details.mo>summary:before{content:"▸ "}details.mo[open]>summary:before{content:"▾ "}
details>summary{cursor:pointer;color:var(--sky);font-weight:600;margin:6px 0}
.doneb{color:var(--ok);font-weight:700;margin:8px 0 0}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}@media(min-width:600px){.nums{grid-template-columns:repeat(4,1fr)}}
.nums div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.03)}.nums span{display:block;color:var(--mute);font-size:13px}.nums b{font:700 17px var(--disp)}.nums .bal{border-color:rgba(255,200,61,.5)}.nums .bal b{color:var(--gold)}
.fh{display:flex;gap:14px;align-items:center}.fh span{display:block;color:var(--mute);font-size:14px}
.er{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}.er .ic{width:30px;text-align:center}.er .t{flex:1;min-width:0}.er .t span{display:block;color:var(--mute);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.k{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04)}.k b{display:block;font:800 24px var(--disp);color:var(--c)}.k span{color:var(--mute);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);margin:12px 0}.kv span{color:var(--mute)}.kv b{font-weight:700;overflow-wrap:anywhere}
/* people */
.dh{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font:700 16px var(--disp);color:var(--sky)}.dh span{color:var(--mute);font:600 13px var(--body)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04)}.pt{display:flex;gap:12px;align-items:center}.pt b{display:block;font:700 17px var(--body)}.pt span{color:var(--mute);font-size:14px}
.avw{position:relative;flex:none}.avw .dot{position:absolute;right:-1px;bottom:-1px;border:2px solid var(--ink2)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#51607f}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pc .meta{color:var(--mute);font-size:14px;overflow-wrap:anywhere}.pc .meta a{color:var(--sky)}
/* map */
.mapw{position:relative}svg{max-width:100%}#map{width:100%;height:auto;display:block}
.land{fill:url(#lg);stroke:var(--sky);stroke-width:1.6;stroke-linejoin:round;filter:url(#glow);stroke-dasharray:7 5;animation:dash 26s linear infinite}
.scan{animation:scan 6s linear infinite}.pin{cursor:pointer;outline:0}.pin:focus-visible circle{stroke:#fff}
.ring{transform-box:fill-box;transform-origin:center;animation:rp 2.4s ease-out infinite}
.lbl{font:600 13px var(--body);fill:#fff;paint-order:stroke;stroke:#061236;stroke-width:3px;pointer-events:none}.lbl.f{fill:#7f95bd;font-weight:500}
.tip{position:absolute;z-index:3;pointer-events:none;min-width:160px;max-width:240px;padding:10px 12px;border-radius:12px;background:rgba(4,10,30,.96);border:1px solid var(--gold);font-size:14px}.tip b{color:var(--gold)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mute)}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;background:var(--c);box-shadow:0 0 10px var(--c);vertical-align:-1px}
/* job modal bits */
.jh{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.jh h3{margin:0 0 4px;font:800 21px var(--disp)}.jh .m{margin:3px 0}
.tl{border-left:2px solid var(--line);padding:2px 0 12px 14px;margin-left:6px}.tl p{margin:4px 0;overflow-wrap:anywhere}.tlh{font-size:14px;color:var(--mute)}.tlh b{color:var(--mist)}.tlh .pct{color:var(--gold);font-weight:700}
.gal{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tile{cursor:pointer;padding:0;border:1px solid var(--line);border-radius:12px;background:#0B1A40;color:var(--mist);width:84px;height:84px;overflow:hidden;display:grid;place-items:center;font:600 12px var(--body);text-align:center}.tile img{width:100%;height:100%;object-fit:cover}.tile.doc{padding:6px;width:auto;min-width:84px;max-width:150px;gap:2px;overflow-wrap:anywhere}
.pf{display:flex;gap:8px;flex-wrap:wrap}.chipf{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:14px}.chipf img{width:36px;height:36px;object-fit:cover;border-radius:6px}.chipf button{background:none;border:0;color:var(--bad);cursor:pointer;font-size:16px}
/* dialogs */
dialog{width:min(640px,calc(100% - 24px));max-height:92vh;margin:auto;padding:22px;border:1px solid var(--line);border-radius:22px;background:#0B1840;color:var(--mist);font:500 16px/1.5 var(--body);box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:auto}
dialog[open]{animation:pop .2s ease-out}dialog::backdrop{background:rgba(3,8,24,.74);backdrop-filter:blur(3px)}
dialog h2{margin:0 0 8px;font:700 22px var(--disp);letter-spacing:-.01em;padding-right:36px}
@media(max-width:640px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:24px 24px 0 0;max-height:94vh;padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px))}}
.mh{position:sticky;top:-6px;display:flex;justify-content:flex-end;height:0;z-index:2}.x{background:rgba(255,255,255,.08);border:0;color:var(--mist);cursor:pointer;font-size:16px;width:36px;height:36px;border-radius:50%}
.vw img{max-width:100%;display:block;margin:6px auto;border-radius:10px}.vw iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:10px}
.pfh{display:flex;gap:14px;align-items:center;margin-bottom:6px}.pfh h2{margin:0 0 2px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0B1840;border:1px solid var(--gold);padding:12px 18px;border-radius:14px;z-index:99999;display:none;max-width:92vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
@media(min-width:960px){#toast{bottom:28px}}
/* login */
.lg{min-height:100vh;display:grid;grid-template-columns:1fr}@media(min-width:900px){.lg{grid-template-columns:1.1fr .9fr}.lbrand{padding-top:14vh}}
.lbrand{position:relative;overflow:hidden;padding:calc(34px + env(safe-area-inset-top,0px)) 26px 26px;display:flex;flex-direction:column;justify-content:flex-start;min-height:270px;background:linear-gradient(140deg,#15348A,#0B1D52 60%,#07122F)}
.lmap{position:absolute;right:-3%;bottom:-5%;height:66%;opacity:.75}.lmap svg{height:100%;width:auto;display:block}
.ltxt{position:relative;z-index:1;max-width:480px}.ltxt .logo{width:56px;height:56px}.ltxt h1{font:800 clamp(32px,7vw,56px)/1.04 var(--disp);margin:18px 0 12px;letter-spacing:-.03em}.ltxt p{font-size:18px;color:#D2E0FF;margin:0;max-width:30ch}
.lside{display:grid;place-items:center;padding:28px 20px 40px}.lcard{width:100%;max-width:410px}.lcard h2{font:800 30px var(--disp);margin:0 0 4px;letter-spacing:-.02em}.lcard .sub{color:var(--mute);margin:0 0 22px}
.lcard label{margin-bottom:16px}.pwrow{position:relative}.pwrow input{padding-right:54px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--mute);font-size:18px;cursor:pointer}
.demo{margin-top:24px;padding:14px;border:1px dashed rgba(255,200,61,.45);border-radius:14px}.demo p{margin:0 0 4px}.demo .chips{margin:10px 0 0}
.lcard .link{display:block;margin:10px auto 0}
.ft{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;color:var(--mute);font-size:13.5px}.ft a{color:var(--sky);text-decoration:none}.ftrow{display:flex;gap:6px 20px;flex-wrap:wrap;justify-content:center}
@keyframes rp{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}@keyframes dash{to{stroke-dashoffset:-400}}@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(700px)}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hmap .lbl{font-size:20px;stroke-width:4px}.pt .st{display:block;font-size:12px;color:var(--mut,#7f8fb0)}.pt .st.on{color:#22c55e}

[hidden]{display:none!important}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wc{display:flex;gap:12px;align-items:stretch;text-align:left;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);color:inherit;cursor:pointer;font:inherit}.wc:hover{border-color:rgba(125,190,255,.5);background:rgba(255,255,255,.07)}
.wph{flex:none;width:76px;height:76px;border-radius:12px;overflow:hidden;background:#0B1A40;display:grid;place-items:center;font-size:32px}.wph img{width:100%;height:100%;object-fit:cover}
.wb{flex:1;min-width:0}.wb b{display:block;font:700 16px var(--body);overflow-wrap:anywhere}.wb>span{display:block;color:var(--mute);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.wbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);margin:9px 0}.wbar i{display:block;height:100%;border-radius:99px}
.wl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wl small{color:var(--mute)}
.gl>.hist+.chips{margin-top:12px}

.dline{display:grid;grid-template-columns:1fr 64px 92px;gap:6px;margin-bottom:6px}.dline input{min-width:0}
.xlbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.xltitle{font-weight:800;flex:1;min-width:120px}
.xlscroll{overflow-x:auto;padding-bottom:10px}
.xl{background:#fff;color:#111;width:760px;margin:0 auto;padding:12px;border-radius:6px;font:13px/1.35 Arial,Helvetica,sans-serif}

.xl input,.xl textarea,.xl select{width:100%;background:#FFFBEA;border:1px dashed #c9b458;color:#111;padding:3px 4px;font:inherit;border-radius:2px;min-height:0}
.xl textarea{resize:vertical;overflow:hidden}.xl label{display:flex;gap:4px;align-items:flex-start;color:#111}
.xl .b{font-weight:700}.xl .rt{width:38%}.xl .re{font-weight:700;display:table-cell}.xl .re input{width:90%}.xl .lbl{font-size:12px;color:#333}
.xl th{background:#FFE699;text-align:center;font-weight:600}.xl .items td{padding:2px}.xl .items td.c{text-align:center;vertical-align:middle}.xl .items .xam{text-align:right;padding:3px 6px;vertical-align:middle}

 const tot=L.reduce((a,d)=>a+dTot(d).total,0),unp=DT==="invoice"?L.reduce((a,d)=>a+Math.max(0,dBal(d)),0):0;

function stmtData(key,from,to){const E=[];for(const d of Object.values(S.docs)){if(ckey(d.client)!==key)continue;

  else if(d.type==="receipt"&&!d.applied)E.push({ts:d.date,o:1,no:"",desc:"Payment - Receipt "+d.no+(d.re?": "+d.re:""),db:0,cr:dTot(d).total})}
 E.sort((a,b)=>a.ts-b.ts||a.o-b.o);let bf=0,bal=0;const rows=[];
 for(const e of E){if(to&&e.ts>to)continue;if(from&&e.ts<from){bf=r2(bf+e.db-e.cr);continue}rows.push(e)}
 bal=bf;for(const r of rows){bal=r2(bal+r.db-r.cr);r.bal=bal}
 return{rows,bf,close:bal,debit:r2(rows.reduce((a,r)=>a+r.db,0)),credit:r2(rows.reduce((a,r)=>a+r.cr,0))}}

 pdfstm(){const fr=dOut(SF),to=dOut(ST)?dOut(ST)+864e5-1:0;try{dl(pdfStmt(SC,fr,to),"statement-"+safeN((custList().find(c=>c.k===SC)||{}).name)+".pdf");logA("Downloaded PDF","Customer statement")}catch(e){toast("Could not build the PDF: "+e.message)}},
 xlsstm(){const fr=dOut(SF),to=dOut(ST)?dOut(ST)+864e5-1:0;try{dl(xlsxStmt(SC,fr,to),"statement-"+safeN((custList().find(c=>c.k===SC)||{}).name)+".xlsx")}catch(e){toast("Could not build the Excel file: "+e.message)}}});
document.addEventListener("change",e=>{const t=e.target;if(!t||!t.dataset)return;if(t.dataset.dc){const k=t.dataset.dc,v=t.value;({DQ:()=>DQ=v,DF:()=>DF=v,DTo:()=>DTo=v,SC:()=>SC=v,SF:()=>SF=v,ST:()=>ST=v,SAP:()=>SAP=v})[k]();render();return}
 if(t.name==="cl"&&t.form&&t.form.dataset.f==="docnew"){const c=custList().find(x=>x.k===ckey(t.value)),a=t.form.querySelector("[name=ad]");if(c&&a&&!a.value&&document.activeElement!==a)a.value=c.addr}});
document.addEventListener("input",e=>{const t=e.target;if(t.closest&&t.closest("#xl")){xlCalc();if(t.tagName==="TEXTAREA"){t.style.height="auto";t.style.height=t.scrollHeight+"px"}}});

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{if(e.target.tagName==="DIALOG"&&e.target.open){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();return}
 if(e.target.closest("select,input,textarea"))return;const el=e.target.closest("[data-a]");if(!el)return;const g=ACT[el.dataset.a];if(g)g(el)});
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-f]");if(!f)return;e.preventDefault();FM[f.dataset.f](f)});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.matches("[data-pick]")){const k=t.dataset.pick,files=[...t.files];t.value="";toast("Preparing files…");for(const f of files){try{(PF[k]=PF[k]||[]).push(await prep(f))}catch(x){toast(x.message)}}renderPF(k);return}
 if(t.matches("[data-st]")){const id=t.dataset.st;run(async()=>{await DB.set(`jobs/${id}/status`,+t.value);logA("Job status → "+LB[+t.value],(S.jobs[id]||{}).company);await pull(true)});return}
 if(t.matches('[name=kind]')){const f=t.closest("form");if(f)f.dataset.kind=t.value;return}
 if(t.dataset.aCh==="mp"){MP=t.value;render();return}
 if(t.dataset.aCh==="cfs"){CF=t.value;render();return}
 if(t.matches("[name=ct]")){const f=t.closest("form"),b=f&&f.querySelector(".szb");if(b)b.hidden=t.value!=="Safes";return}
 if(t.matches("[name=sz]")){const f=t.closest("form"),o=f&&f.querySelector(".szo");if(o)o.hidden=t.value!=="__o";return}
 if(t.matches("[data-f=wu] [name=st]")){const r=t.closest("form").querySelector("[name=pc]");r.value=WSP[+t.value];r.dispatchEvent(new Event("input"));return}
 if(t.dataset.aCh==="roledef"){const f=t.closest("form");const d=ROLES[t.value].p;f.querySelectorAll("[name=pm]").forEach(c=>c.checked=d.includes(c.value));f.querySelector("[name=dp]").value=ROLES[t.value].d;return}
 if(t.id==="rf"){const file=t.files[0];t.value="";if(!file)return;try{const d=JSON.parse(await file.text());if(!confirm("Replace ALL current data with this backup?"))return;for(const k of["jobs","workshop","updates","requests","funds","log","inbox"])LD[k]=d[k]||{};if(d.users)LD.users=d.users;await KV.set("db",LD);SIG="";CUR.updates=CUR.inbox=CUR.log=0;S.updates={};S.inbox={};S.log={};await pull(true);toast("Backup restored")}catch(x){toast("That file is not a valid backup.")}}});
document.addEventListener("pointermove",e=>{const t=$("tip"),g=e.target.closest&&e.target.closest(".pin");if(!t)return;if(!g){t.hidden=true;return}const n=g.dataset.t,js=visJobs().filter(j=>j.town===n),r=t.parentNode.getBoundingClientRect();
 t.innerHTML=`<b>${esc(n)}</b>`+(js.length?js.slice(0,4).map(j=>`<div>${IC[j.cat]||""} ${esc(j.company)} · ${jPct(j)}% <span style="color:${COL[j.status]}">●</span></div>`).join("")+(js.length>4?`<div>+${js.length-4} more</div>`:""):"<div>No jobs yet</div>");
 t.hidden=false;t.style.left=Math.min(e.clientX-r.left+14,r.width-160)+"px";t.style.top=Math.max(e.clientY-r.top-10,0)+"px"});
document.addEventListener("click",e=>{const g=e.target.closest&&e.target.closest(".pin");if(!g)return;const n=g.dataset.t;sel=sel===n?null:n;render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest&&e.target.closest(".pin"))e.target.closest(".pin").dispatchEvent(new Event("click",{bubbles:true}))});
document.addEventListener("input",e=>{const t=e.target;if(t.name==="lid")t.dataset.touched="1";if(t.name==="nm"&&t.form&&t.form.dataset.f==="user"&&!t.form.dataset.id){const l=t.form.querySelector("[name=lid]");if(l&&!l.dataset.touched){const b=normId(firstName(t.value));let c=b,n=2;while(b&&Object.values(S.users).some(u=>u.login===c))c=b+n++;l.value=c}}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
window.addEventListener("online",()=>pull(true));
init();
</script></body></html>
